providers = ["python"]

[phases.install]
cmds = [
  "python -m venv --copies /opt/venv && /opt/venv/bin/python -m pip install --upgrade pip && /opt/venv/bin/python -m pip install -r requirements.txt"
]
paths = ["/opt/venv/bin"]

[start]
cmd = "/opt/venv/bin/python -m uvicorn app:app --host 0.0.0.0 --port $PORT"
